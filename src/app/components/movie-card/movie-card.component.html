<div class="block-content">
    <p-card [header]="inputData.title" [style]="{ width: '100%', 'max-width': '200px' }">
        <ng-template pTemplate="header">
            <img [src]="'https://image.tmdb.org/t/p/w500/' + inputData.poster_path" alt="inputData.title"
                (click)="navigateToDetails(inputData.id)" />
        </ng-template>
        
        <div class="rating-section">
            <p-rating 
                [(ngModel)]="rating" 
                [readonly]="true" 
                iconCancelClass="pi pi-star"
                [cancel]="false">
            </p-rating>
            <span class="vote-average">{{ inputData.vote_average }}/10</span>
        </div>
        
        <ng-template pTemplate="footer">
            <div class="flex mt-1" *ngIf="catalog !== 'favorites' && catalog !== 'watchList'; else remove">
                <p-button label="watchList" severity="secondary" class="w-full" (click)="addToWatchList(inputData)">
                </p-button>
                <p-button label="favorites" class="w-full" (click)="addToFavorites(inputData)">
                </p-button>
            </div>
            <ng-template #remove>
                <p-button label="Remove" severity="danger" class="w-full" (click)="deleteFrom(inputData)">
                </p-button>
            </ng-template>
        </ng-template>
    </p-card>
</div>
